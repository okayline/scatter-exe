<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCATTER.EXE</title>
<meta name="description" content="One letter, 8 categories, 2 minutes. Score only the answers nobody else gave.">
<style>
  /* One terminal screen: 4Dungeon's 80-column text frame, font and colours (copied from clutch-feed-tilt index.html). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --bad: #e0564a;
    --gold: #e3b341;
    --mono: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    margin: 0; min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
    font-family: var(--mono); font-variant-ligatures: none;
  }
  .game { position: relative; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); max-width: 100%; }
  .game pre { margin: 0; font: inherit; line-height: 1.05; white-space: pre; }
  @media (max-width: 700px) {
    body { padding-left: 4px; padding-right: 4px; }
    .game { font-size: calc((100vw - 8px) / 32.5); }
  }
  .d { color: var(--dim); } .t { color: var(--trail); } .b { color: var(--bright); } .g { color: var(--gold); } .e { color: var(--bad); }
  .btn { cursor: pointer; color: var(--bright); display: inline-block; }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); cursor: default; } .btn.off:hover { background: none; color: var(--dim); }
  /* an answer box: one line of the frame, 36 columns */
  .ans { font: inherit; line-height: inherit; height: 1.05em; width: 36ch; padding: 0; margin: 0; border: 0; border-radius: 0;
         background: #141a16; color: var(--bright); caret-color: var(--gold); vertical-align: top; text-transform: none; }
  .ans:focus { outline: none; background: #1d261f; }
  .ans.bad { background: #3a1513; color: var(--bad); }
</style>
</head>
<body>
<div class="game" id="game">
  <pre id="frame"></pre>
  <!-- the footer every game shows (dungeon-items src/footer.js): "🄯 ~*~88x31~*~ · § ≡ version"; ≡ pops up the save codes / passkeys / carry window (/api/carry) -->
  <script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.3.0"></script>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
